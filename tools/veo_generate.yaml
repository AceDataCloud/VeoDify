identity:
  name: veo_generate_video
  author: acedatacloud
  label:
    en_US: Veo Generate Video
    zh_Hans: Veo 生成视频
description:
  human:
    en_US: Generate videos with Ace Data Cloud Veo Videos API.
    zh_Hans: 通过 Ace Data Cloud Veo Videos API 生成视频。
  llm: Generate a video from prompt / images via Ace Data Cloud Veo Videos API. Generation
    returns a task ID. Query the same task until complete; never resubmit a pending
    generation.
parameters:
- name: model
  type: select
  required: false
  label:
    en_US: Model
    zh_Hans: 模型
  human_description:
    en_US: Select the current API model for this operation.
    zh_Hans: 用于生成视频的模型，默认值为 `veo3-fast`，示例使用 `veo31-fast`。若 `resolution` 为 `4k`，此处必须填
      `veo31`（且 `action` 需为 `text2video`）。
  llm_description: Select the current API model for this operation.
  form: form
  default: veo31-fast
  options:
  - value: veo3
    label:
      en_US: veo3
      zh_Hans: veo3
  - value: veo3-fast
    label:
      en_US: veo3-fast
      zh_Hans: veo3-fast
  - value: veo31-fast
    label:
      en_US: veo31-fast
      zh_Hans: veo31-fast
  - value: veo31
    label:
      en_US: veo31
      zh_Hans: veo31
  - value: veo31-fast-ingredients
    label:
      en_US: veo31-fast-ingredients
      zh_Hans: veo31-fast-ingredients
- name: resolution
  type: select
  required: false
  label:
    en_US: Resolution
    zh_Hans: 分辨率
  human_description:
    en_US: Optional output resolution.
    zh_Hans: 可选输出分辨率。
  llm_description: Optional output resolution.
  form: form
  options:
  - value: 4k
    label:
      en_US: 4k
      zh_Hans: 4k
  - value: 1080p
    label:
      en_US: 1080p
      zh_Hans: 1080p
  - value: gif
    label:
      en_US: gif
      zh_Hans: gif
- name: action
  type: select
  required: false
  label:
    en_US: Action
    zh_Hans: 行为
  human_description:
    en_US: Choose how to generate the video.
    zh_Hans: 选择视频生成方式。
  llm_description: Choose how to generate the video.
  form: form
  default: text2video
  options:
  - value: text2video
    label:
      en_US: text2video
      zh_Hans: text2video
  - value: image2video
    label:
      en_US: image2video
      zh_Hans: image2video
  - value: ingredients2video
    label:
      en_US: ingredients2video
      zh_Hans: ingredients2video
  - value: get1080p
    label:
      en_US: get1080p
      zh_Hans: get1080p
- name: prompt
  type: string
  required: false
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Required for text2video and image2video.
    zh_Hans: text2video / image2video 必填。
  llm_description: Required for text2video and image2video.
  form: llm
- name: video_id
  type: string
  required: false
  label:
    en_US: Video ID
    zh_Hans: 视频ID
  human_description:
    en_US: Required for get1080p.
    zh_Hans: get1080p 必填。
  llm_description: Required for get1080p.
  form: form
- name: translation
  type: boolean
  required: false
  label:
    en_US: Auto-translate prompt
    zh_Hans: 自动翻译提示词
  human_description:
    en_US: Enable automatic prompt translation.
    zh_Hans: 是否开启提示词自动翻译。
  llm_description: Enable automatic prompt translation.
  form: form
- name: aspect_ratio
  type: select
  required: false
  label:
    en_US: Aspect ratio
    zh_Hans: 画面比例
  human_description:
    en_US: Optional output aspect ratio.
    zh_Hans: 可选输出画面比例。
  llm_description: Optional output aspect ratio.
  form: form
  default: '16:9'
  options:
  - value: '16:9'
    label:
      en_US: '16:9'
      zh_Hans: '16:9'
  - value: '9:16'
    label:
      en_US: '9:16'
      zh_Hans: '9:16'
- name: image_urls
  type: string
  required: false
  label:
    en_US: Image URLs
    zh_Hans: 图片链接
  human_description:
    en_US: Required for image2video. Use 1-3 images (depending on model capability).
      Enter a JSON array.
    zh_Hans: image2video 必填。根据模型能力传 1-3 张图。 请填写 JSON 数组。
  llm_description: Required for image2video. Use 1-3 images (depending on model capability).
    Enter a JSON array.
  form: form
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/veo_generate.py
