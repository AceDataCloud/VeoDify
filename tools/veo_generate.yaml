identity:
  name: veo_generate_video
  author: acedatacloud
  label:
    en_US: Veo Generate Video
    zh_Hans: Veo 生成视频
description:
  human:
    en_US: Generate videos with Ace Data Cloud Veo Videos API.
    zh_Hans: 通过 Ace Data Cloud Veo Videos API 生成视频。
  llm: Generate videos with Ace Data Cloud Veo Videos API. For asynchronous results,
    preserve task_id and use the task retrieval tool until completion. A successful
    submission is not completed output.
parameters:
- name: model
  type: select
  required: false
  form: form
  label:
    en_US: Model
    zh_Hans: 模型
  human_description:
    en_US: Select a model currently supported by this API. Availability and pricing
      depend on the chosen model.
    zh_Hans: 用于生成视频的模型，默认值为 `veo3-fast`，示例使用 `veo31-fast`。若 `resolution` 为 `4k`，此处必须填
      `veo31`（且 `action` 需为 `text2video`）。
  llm_description: Select a model currently supported by this API. Availability and
    pricing depend on the chosen model.
  default: veo31-fast
  options:
  - value: veo3
    label:
      en_US: veo3
      zh_Hans: veo3
  - value: veo3-fast
    label:
      en_US: veo3-fast
      zh_Hans: veo3-fast
  - value: veo31-fast
    label:
      en_US: veo31-fast
      zh_Hans: veo31-fast
  - value: veo31
    label:
      en_US: veo31
      zh_Hans: veo31
  - value: veo31-fast-ingredients
    label:
      en_US: veo31-fast-ingredients
      zh_Hans: veo31-fast-ingredients
- name: resolution
  type: select
  required: false
  form: form
  label:
    en_US: Resolution
    zh_Hans: 分辨率
  human_description:
    en_US: Optional output resolution.
    zh_Hans: 生成视频的分辨率，可选值为 `4k`、`1080p` 或 `gif`，默认值为 `1080p`。`4k` 仅在 `action` 为 `text2video`
      且 `model` 为 `veo31` 时可用，其他组合会在生成阶段失败。
  llm_description: Optional output resolution.
  options:
  - value: 4k
    label:
      en_US: 4k
      zh_Hans: 4k
  - value: 1080p
    label:
      en_US: 1080p
      zh_Hans: 1080p
  - value: gif
    label:
      en_US: gif
      zh_Hans: gif
- name: action
  type: select
  required: false
  form: form
  label:
    en_US: Action
    zh_Hans: 行为
  human_description:
    en_US: Choose how to generate the video.
    zh_Hans: 生成视频的动作类型。`text2video` 根据提示词生成视频；`image2video` 根据 1-2 张参考图片（首帧，或首帧 +
      尾帧）生成视频；`ingredients2video` 根据 1-3 张参考图片生成视频，内部强制使用 `veo31-fast-ingredients`
      模型（该动作下 model 参数会被忽略）；`get1080p` 是 `POST /veo/upsample`（`action=1080p`）的已废弃别名，仅为向后兼容保留。
  llm_description: Choose how to generate the video.
  default: text2video
  options:
  - value: text2video
    label:
      en_US: text2video
      zh_Hans: text2video
  - value: image2video
    label:
      en_US: image2video
      zh_Hans: image2video
  - value: ingredients2video
    label:
      en_US: ingredients2video
      zh_Hans: ingredients2video
  - value: get1080p
    label:
      en_US: get1080p
      zh_Hans: get1080p
- name: prompt
  type: string
  required: false
  form: llm
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Required for text2video and image2video.
    zh_Hans: 用于生成视频的提示词。
  llm_description: Required for text2video and image2video.
- name: video_id
  type: string
  required: false
  form: form
  label:
    en_US: Video ID
    zh_Hans: 视频ID
  human_description:
    en_US: Required for get1080p.
    zh_Hans: 需要引用的视频 ID，仅在 action 为 `get1080p` 时有效。
  llm_description: Required for get1080p.
- name: translation
  type: boolean
  required: false
  form: form
  label:
    en_US: Auto-translate prompt
    zh_Hans: 自动翻译提示词
  human_description:
    en_US: Enable automatic prompt translation.
    zh_Hans: 是否启用提示词自动翻译，默认值为 `false`。
  llm_description: Enable automatic prompt translation.
- name: aspect_ratio
  type: select
  required: false
  form: form
  label:
    en_US: Aspect ratio
    zh_Hans: 画面比例
  human_description:
    en_US: Optional output aspect ratio.
    zh_Hans: 设置视频输出的宽高比，仅支持 `16:9` 或 `9:16`。
  llm_description: Optional output aspect ratio.
  default: '16:9'
  options:
  - value: '16:9'
    label:
      en_US: '16:9'
      zh_Hans: '16:9'
  - value: '9:16'
    label:
      en_US: '9:16'
      zh_Hans: '9:16'
- name: image_urls
  type: string
  required: false
  form: form
  label:
    en_US: Image URLs
    zh_Hans: 图片链接
  human_description:
    en_US: Required for image2video. Use 1-3 images (depending on model capability).
      Enter a JSON array. Enter a JSON array or object where applicable.
    zh_Hans: 生成视频时使用的参考图片 URL 列表，仅在 action 为 `image2video` 或 `ingredients2video` 时有效。
      数组或对象请使用 JSON 格式。
  llm_description: Required for image2video. Use 1-3 images (depending on model capability).
    Enter a JSON array. Enter a JSON array or object where applicable.
- name: callback_url
  type: string
  required: false
  form: form
  label:
    en_US: Callback Url
    zh_Hans: 回调 URL
  human_description:
    en_US: Set callback url for this operation.
    zh_Hans: 视频生成完成后将被调用的回调 URL。
  llm_description: Set callback url for this operation.
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/veo_generate.py
